<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>IT Essentials - Trenažér</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --primary: #38bdf8;
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    h1 { font-size: 1.4rem; color: var(--primary); margin-bottom: 12px; }
    .btn { background: var(--primary); color: #0f172a; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.15s; font-size: 0.95rem; }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-secondary { background: transparent; color: var(--subtext); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); color: var(--text); }
    .btn-bookmark { background: #334155; color: var(--text); border: 1px solid var(--border); padding: 6px 12px; font-size: 0.85rem; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn-bookmark.active { background: #b45309; border-color: var(--warning); color: #fff; }
    .mode-select { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
    @media (min-width: 500px) { .mode-select { flex-direction: row; } }
    .mode-select button { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: var(--text); cursor: pointer; font-weight: bold; }
    .mode-select button.active { border-color: var(--primary); background: #0369a1; }
    .progress-bar { height: 8px; background: #0f172a; border-radius: 4px; overflow: hidden; margin-bottom: 15px; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.2s; }
    .meta-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: var(--subtext); margin-bottom: 15px; }
    .q-text { font-size: 1.1rem; font-weight: 600; margin-bottom: 15px; line-height: 1.5; }
    .q-img { max-width: 100%; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border); }
    .options-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .option-item { border: 1px solid var(--border); background: #0f172a; padding: 12px 14px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: 0.15s; }
    .option-item:hover { border-color: var(--subtext); }
    .option-item.selected { border-color: var(--primary); background: #1e3a5f; }
    .option-item.correct { border-color: var(--success); background: #064e3b; color: #a7f3d0; }
    .option-item.wrong { border-color: var(--error); background: #7f1d1d; color: #fecaca; }
    .explanation-box { background: #0f172a; border-left: 4px solid var(--primary); padding: 12px; border-radius: 4px; font-size: 0.9rem; color: var(--subtext); margin-bottom: 15px; line-height: 1.5; }
    .nav-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .nav-actions { display: flex; gap: 8px; }
    .feedback { font-weight: bold; font-size: 1rem; width: 100%; margin-bottom: 8px; }
    .feedback.ok { color: var(--success); }
    .feedback.err { color: var(--error); }
    .hidden { display: none !important; }
    .stat-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
    .stat-item { background: #0f172a; padding: 15px; border-radius: 8px; text-align: center; }
    .stat-item span { font-size: 1.8rem; font-weight: bold; display: block; }
  </style>
</head>
<body>

<div class="container">
  <!-- START PANEL -->
  <div id="setup-panel" class="card">
    <h1>IT Essentials Trenažér</h1>
    <p id="loadingStatus" style="color: var(--subtext); margin-bottom: 20px;">Načítám otázky...</p>

    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 8px;">Zvolit režim:</label>
      <div class="mode-select">
        <button type="button" class="mode-btn active" data-mode="drill">Drill (vše)</button>
        <button type="button" class="mode-btn" data-mode="custom" id="savedModeBtn">Uložené otázky (0)</button>
        <button type="button" class="mode-btn" data-mode="exam">Ostrý test</button>
      </div>
    </div>

    <div id="exam-opts" class="hidden" style="margin-bottom: 20px;">
      <label>Počet náhodných otázek:</label>
      <input type="number" id="examCount" value="30" min="5" max="200" style="padding: 6px; background: #0f172a; border: 1px solid var(--border); color: #fff; border-radius: 4px; width: 80px;">
    </div>

    <button id="startBtn" class="btn" style="width: 100%;" disabled>Začít procvičovat</button>
  </div>

  <!-- QUIZ PANEL -->
  <div id="quiz-panel" class="card hidden">
    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    
    <div class="meta-bar">
      <span id="counter">Otázka 1/X</span>
      <button id="bookmarkBtn" class="btn-bookmark">⭐ Uložit do Neumím</button>
    </div>

    <div id="qText" class="q-text">Otázka...</div>
    <img id="qImg" class="q-img hidden" src="" alt="Otázka k obrázku">

    <div id="optionsContainer" class="options-grid"></div>
    <div id="explanationBox" class="explanation-box hidden"></div>

    <div id="feedback" class="feedback"></div>

    <div class="nav-bar">
      <button id="prevBtn" class="btn btn-secondary">&larr; Předchozí</button>
      <div class="nav-actions">
        <button id="checkBtn" class="btn">Zkontrolovat</button>
        <button id="nextBtn" class="btn">Další &rarr;</button>
      </div>
    </div>
  </div>

  <!-- RESULT PANEL -->
  <div id="result-panel" class="card hidden" style="text-align: center;">
    <h1>Výsledky</h1>
    <div class="stat-box">
      <div class="stat-item"><span id="resScore" style="color: var(--primary);">0</span>Správně</div>
      <div class="stat-item"><span id="resTotal">0</span>Otázek celkem</div>
    </div>
    <p id="resPercent" style="font-size: 1.3rem; font-weight: bold; margin-bottom: 20px;">0 %</p>
    <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
      <button id="restartBtn" class="btn">Zpět do menu</button>
      <button id="repeatErrorsBtn" class="btn btn-secondary hidden">Procvičit jen chyby</button>
    </div>
  </div>
</div>

<script>
  let allQuestions = [];
  let testPool = [];
  let currentIndex = 0;
  let mode = 'drill';
  let userProgress = {};

  // Správa uložených otázek v paměti prohlížeče
  let savedQuestionIds = JSON.parse(localStorage.getItem('ite_saved_questions') || '[]');

  const startBtn = document.getElementById('startBtn');
  const loadingStatus = document.getElementById('loadingStatus');
  const setupPanel = document.getElementById('setup-panel');
  const quizPanel = document.getElementById('quiz-panel');
  const resultPanel = document.getElementById('result-panel');
  const qText = document.getElementById('qText');
  const qImg = document.getElementById('qImg');
  const optionsContainer = document.getElementById('optionsContainer');
  const explanationBox = document.getElementById('explanationBox');
  const checkBtn = document.getElementById('checkBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const feedback = document.getElementById('feedback');
  const counter = document.getElementById('counter');
  const progressFill = document.getElementById('progressFill');
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  const savedModeBtn = document.getElementById('savedModeBtn');

  function updateSavedCount() {
    savedModeBtn.innerText = `Uložené otázky (${savedQuestionIds.length})`;
  }
  updateSavedCount();

  // Načtení questions.json
  window.addEventListener('DOMContentLoaded', () => {
    fetch('questions.json')
      .then(res => {
        if (!res.ok) throw new Error('Nelze načíst questions.json');
        return res.json();
      })
      .then(data => {
        allQuestions = data;
        loadingStatus.innerText = `Připraveno ${allQuestions.length} otázek.`;
        startBtn.disabled = false;
      })
      .catch(err => {
        loadingStatus.innerText = 'Chyba při načítání questions.json.';
        console.error(err);
      });
  });

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.dataset.mode;
      document.getElementById('exam-opts').classList.toggle('hidden', mode !== 'exam');
    });
  });

  // Ukládání otázky tlačítkem ⭐
  bookmarkBtn.addEventListener('click', () => {
    const q = testPool[currentIndex];
    const qKey = q.question; // unikátní klíč otázky
    const idx = savedQuestionIds.indexOf(qKey);

    if (idx > -1) {
      savedQuestionIds.splice(idx, 1);
      bookmarkBtn.classList.remove('active');
      bookmarkBtn.innerText = '⭐ Uložit do Neumím';
    } else {
      savedQuestionIds.push(qKey);
      bookmarkBtn.classList.add('active');
      bookmarkBtn.innerText = '★ Uloženo v Neumím';
    }

    localStorage.setItem('ite_saved_questions', JSON.stringify(savedQuestionIds));
    updateSavedCount();
  });

  startBtn.addEventListener('click', () => {
    if (mode === 'custom') {
      const savedPool = allQuestions.filter(q => savedQuestionIds.includes(q.question));
      if (savedPool.length === 0) {
        alert('Zatím nemáš uložené žádné otázky. Při procvičování klikni na tlačítko "⭐ Uložit do Neumím".');
        return;
      }
      testPool = [...savedPool];
    } else if (mode === 'exam') {
      const count = parseInt(document.getElementById('examCount').value) || 30;
      testPool = [...allQuestions].sort(() => 0.5 - Math.random()).slice(0, count);
    } else {
      testPool = [...allQuestions];
    }
    startQuiz(testPool);
  });

  function startQuiz(pool) {
    testPool = pool;
    currentIndex = 0;
    userProgress = {};
    setupPanel.classList.add('hidden');
    resultPanel.classList.add('hidden');
    quizPanel.classList.remove('hidden');
    loadQuestion();
  }

  function loadQuestion() {
    const q = testPool[currentIndex];
    const state = userProgress[currentIndex] || { selected: [], checked: false, isCorrect: false };

    prevBtn.disabled = (currentIndex === 0);
    nextBtn.innerText = (currentIndex === testPool.length - 1) ? 'Ukončit' : 'Další \u2192';

    qText.innerText = `${currentIndex + 1}. ${q.question}`;
    if (q.image) {
      qImg.src = q.image;
      qImg.classList.remove('hidden');
    } else {
      qImg.classList.add('hidden');
    }

    // Aktualizace stavu hvězdičky/záložky
    if (savedQuestionIds.includes(q.question)) {
      bookmarkBtn.classList.add('active');
      bookmarkBtn.innerText = '★ Uloženo v Neumím';
    } else {
      bookmarkBtn.classList.remove('active');
      bookmarkBtn.innerText = '⭐ Uložit do Neumím';
    }

    counter.innerText = `Otázka ${currentIndex + 1} / ${testPool.length}`;
    progressFill.style.width = `${((currentIndex + 1) / testPool.length) * 100}%`;

    feedback.innerText = '';
    feedback.className = 'feedback';
    explanationBox.classList.add('hidden');

    optionsContainer.innerHTML = '';
    const isMultiple = q.correct.length > 1;

    q.options.forEach((opt, idx) => {
      const div = document.createElement('div');
      div.className = 'option-item';
      const isChecked = state.selected.includes(idx);
      if (isChecked) div.classList.add('selected');

      if (state.checked && mode !== 'exam') {
        div.classList.add('locked');
        if (q.correct.includes(opt)) div.classList.add('correct');
        else if (isChecked) div.classList.add('wrong');
      }

      div.innerHTML = `
        <input type="${isMultiple ? 'checkbox' : 'radio'}" name="opt" id="opt_${idx}" ${isChecked ? 'checked' : ''} ${state.checked && mode !== 'exam' ? 'disabled' : ''}>
        <label for="opt_${idx}" style="cursor: pointer; width: 100%;">${opt}</label>
      `;

      div.addEventListener('click', (e) => {
        if (state.checked && mode !== 'exam') return;
        const input = div.querySelector('input');
        if (e.target !== input) input.checked = !input.checked;

        if (!isMultiple) {
          document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
          state.selected = input.checked ? [idx] : [];
        } else {
          if (input.checked) {
            if (!state.selected.includes(idx)) state.selected.push(idx);
          } else {
            state.selected = state.selected.filter(i => i !== idx);
          }
        }
        div.classList.toggle('selected', input.checked);
        userProgress[currentIndex] = state;
      });

      optionsContainer.appendChild(div);
    });

    if (state.checked && mode !== 'exam') {
      checkBtn.classList.add('hidden');
      if (state.isCorrect) {
        feedback.innerText = 'Správně!';
        feedback.className = 'feedback ok';
      } else {
        feedback.innerText = 'Špatně!';
        feedback.className = 'feedback err';
      }
      if (q.explanation) {
        explanationBox.innerHTML = `<b>Explanation:</b> ${q.explanation}`;
        explanationBox.classList.remove('hidden');
      }
    } else {
      checkBtn.classList.remove('hidden');
      if (mode === 'exam') checkBtn.classList.add('hidden');
    }
  }

  checkBtn.addEventListener('click', () => {
    const q = testPool[currentIndex];
    const state = userProgress[currentIndex] || { selected: [], checked: false, isCorrect: false };

    if (!state.selected || state.selected.length === 0) {
      alert('Vyber alespoň jednu možnost!');
      return;
    }

    const selectedTexts = state.selected.map(idx => q.options[idx]);
    const isCorrect = selectedTexts.length === q.correct.length &&
                      selectedTexts.every(opt => q.correct.includes(opt));

    state.checked = true;
    state.isCorrect = isCorrect;
    userProgress[currentIndex] = state;

    loadQuestion();
  });

  prevBtn.addEventListener('click', () => {
    if (currentIndex > 0) {
      currentIndex--;
      loadQuestion();
    }
  });

  nextBtn.addEventListener('click', () => {
    if (currentIndex < testPool.length - 1) {
      currentIndex++;
      loadQuestion();
    } else {
      showResults();
    }
  });

  function showResults() {
    quizPanel.classList.add('hidden');
    resultPanel.classList.remove('hidden');

    let correctCount = 0;
    const wrongList = [];

    testPool.forEach((q, idx) => {
      const state = userProgress[idx];
      if (state && state.selected && state.selected.length > 0) {
        const selectedTexts = state.selected.map(i => q.options[i]);
        const isOk = selectedTexts.length === q.correct.length &&
                     selectedTexts.every(opt => q.correct.includes(opt));
        if (isOk) correctCount++;
        else wrongList.push(q);
      } else {
        wrongList.push(q);
      }
    });

    const total = testPool.length;
    const percent = Math.round((correctCount / total) * 100);

    document.getElementById('resScore').innerText = correctCount;
    document.getElementById('resTotal').innerText = total;
    const resPercent = document.getElementById('resPercent');
    resPercent.innerText = `${percent} %`;

    if (percent >= 75) {
      resPercent.style.color = 'var(--success)';
      resPercent.innerText += ' (SPLNĚNO)';
    } else {
      resPercent.style.color = 'var(--error)';
      resPercent.innerText += ' (NESPLNĚNO)';
    }

    const repBtn = document.getElementById('repeatErrorsBtn');
    if (wrongList.length > 0) {
      repBtn.classList.remove('hidden');
      repBtn.innerText = `Procvičit jen chyby (${wrongList.length})`;
      repBtn.onclick = () => {
        mode = 'drill';
        startQuiz([...wrongList]);
      };
    } else {
      repBtn.classList.add('hidden');
    }
  }

  document.getElementById('restartBtn').addEventListener('click', () => {
    updateSavedCount();
    resultPanel.classList.add('hidden');
    setupPanel.classList.remove('hidden');
  });
</script>
</body>
</html>
